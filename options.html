<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Adobe Stock Metadata AI Assistant — Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      color: #1a1a1a;
      padding: 0 16px;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 4px;
    }
    p.subtitle {
      color: #666;
      font-size: 13px;
      margin-top: 0;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="password"],
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      background: #1473e6;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #0d66d0;
    }
    #toggleVisibility {
      background: #e8e8e8;
      color: #1a1a1a;
      padding: 10px 12px;
    }
    #toggleVisibility:hover {
      background: #d8d8d8;
    }
    #statusMessage {
      font-size: 13px;
      min-height: 18px;
    }
    #statusMessage.success { color: #268e6c; }
    #statusMessage.error { color: #d31510; }
    .help {
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }
    .help a {
      color: #1473e6;
    }
  </style>
</head>
<body>
  <h1>Adobe Stock Metadata AI Assistant</h1>
  <p class="subtitle">Enter your Gemini API key to enable AI-generated titles and keywords.</p>

  <label for="apiKeyInput">Gemini API Key</label>
  <div class="row">
    <input type="password" id="apiKeyInput" placeholder="AIza..." autocomplete="off" />
    <button type="button" id="toggleVisibility">Show</button>
  </div>

  <button type="button" id="saveButton">Save Key</button>
  <p id="statusMessage"></p>

  <p class="help">
    You can create a Gemini API key at
    <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer">Google AI Studio</a>.
    The key is stored locally in your browser (chrome.storage.local) and is only sent directly to Google's Gemini API.
  </p>

  <script src="options.js"></script>
</body>
</html>
